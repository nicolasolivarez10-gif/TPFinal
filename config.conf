# =============================================================================
# config.conf - Parámetros del script (se pueden cambiar sin tocar el código)
# Formato: VARIABLE="valor"   (sin espacios alrededor del signo =)
# DIR_SCRIPT es la carpeta donde está mantenimiento.sh
# =============================================================================

# --- Tarea 1: Respaldo -------------------------------------------------------
ORIGEN_BACKUP="$HOME/Documents"           # Carpeta a respaldar (en Raspberry Pi OS en español puede ser "Documentos")
DESTINO_BACKUP="$HOME/backups"            # Dónde se guardan los .tar.gz
DIAS_BACKUP=7                             # Los backups más viejos que esto se borran

# --- Tarea 3: Archivos grandes -----------------------------------------------
DIR_GRANDES="$HOME"                       # Carpeta a analizar
MB_GRANDES=100                            # Tamaño mínimo en MB
CANTIDAD_GRANDES=20                       # Máximo de archivos en el informe

# --- Logs --------------------------------------------------------------------
DIR_LOGS="$DIR_SCRIPT/logs"
